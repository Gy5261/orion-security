[build-system]
requires = ["setuptools>=78.1.1,<85", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-hacking-etico"
version = "2.1.1"
description = "Universal MCP and plugin runtime for authorized defensive security and OSINT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = []
keywords = ["cybersecurity", "ethical-hacking", "plugins", "mcp", "osint", "defensive-security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Security",
]

[project.scripts]
orion = "orion.cli:main"
orion-mcp = "orion.mcp.server:main"

[project.entry-points."orion.plugins"]
ioc_enricher = "orion.plugins.builtin:IocEnricherPlugin"
tls_posture_audit = "orion.plugins.builtin:TlsPostureAuditPlugin"
findings_ticket_sync = "orion.plugins.builtin:FindingsTicketSyncPlugin"
spiderfoot = "orion.plugins.osint:SpiderFootPlugin"
theharvester = "orion.plugins.osint:TheHarvesterPlugin"
sherlock = "orion.plugins.osint:SherlockPlugin"
osint_spy = "orion.plugins.osint:OsintSpyPlugin"
phoneinfoga = "orion.plugins.osint:PhoneInfogaPlugin"
photon = "orion.plugins.osint:PhotonPlugin"

[project.optional-dependencies]
mcp = ["mcp>=1.30,<2"]
dev = [
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "mypy>=2.4,<3",
  "pytest>=8,<10",
  "pytest-socket>=0.7,<1",
  "pytest-timeout>=2.3,<3",
  "ruff>=0.17,<1",
  "tomli>=2,<3; python_version < '3.11'",
]
all = ["mcp>=1.30,<2"]

[project.urls]
Homepage = "https://github.com/Gy5261/orion-security"
Repository = "https://github.com/Gy5261/orion-security"
Documentation = "https://github.com/Gy5261/orion-security/blob/main/docs/MCP_SERVER.md"
Issues = "https://github.com/Gy5261/orion-security/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["orion", "orion.*"]
namespaces = false

# Explicitly ship the read-only catalog and both offline bootstrap scripts.
# Repository-private files and generated assessment output are never globbed in.
[tool.setuptools.package-data]
orion = [
  "*.md",
  "references/*.md",
  "references/*.txt",
  "playbooks/*.md",
  "agents/*.yaml",
  "scripts/*.sh",
  "scripts/*.ps1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.isort]
known-first-party = ["orion"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["orion.scripts.*", "mcp.*"]
ignore_errors = true
