name: Dependency security review

on:
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - requirements.txt
      - .github/workflows/controlled-review.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Resolve declared dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.2,<27'
          python -m pip install ".[dev,mcp]" 'pip-audit>=2.9,<3'
          python -m pip check
          python -m pip freeze > "$RUNNER_TEMP/orion-audit-environment.txt"
          python - <<'PY' > "$RUNNER_TEMP/orion-third-party-requirements.txt"
          from importlib.metadata import distributions
          from packaging.utils import canonicalize_name

          # ORION is built from this checkout and checked by source tests.
          # Audit every resolved third-party package separately.
          packages = {f"{dist.metadata['Name']}=={dist.version}" for dist in distributions()
                      if canonicalize_name(dist.metadata['Name']) != 'orion-hacking-etico'}
          print('\n'.join(sorted(packages)))
          PY
      - name: Check published vulnerability advisories
        # This job intentionally contacts the advisory service; application tests
        # belong to CI and allow only local loopback connections.
        run: >-
          python -m pip_audit --progress-spinner off --strict
          --format json --output "$RUNNER_TEMP/orion-dependency-audit.json"
          --requirement "$RUNNER_TEMP/orion-third-party-requirements.txt"
          --no-deps --disable-pip
      - name: Retain dependency audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orion-dependency-audit
          path: |
            ${{ runner.temp }}/orion-dependency-audit.json
            ${{ runner.temp }}/orion-audit-environment.txt
            ${{ runner.temp }}/orion-third-party-requirements.txt
          if-no-files-found: warn
          retention-days: 14
