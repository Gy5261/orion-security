name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  quality:
    name: Source and contract quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.2,<27'
          python -m pip install ".[dev,mcp]"
          python -m pip check
      - name: Compile, lint, and type-check
        run: |
          python -m compileall -q orion tools tests .github/scripts
          python -m ruff check orion tools tests .github/scripts
          python -m mypy orion
      - name: Validate schemas, manifest, entry points, and process calls
        run: python tools/validate_repository.py
      - name: Validate shell bootstrap without installing tools
        run: |
          bash -n orion/scripts/install-safe-tooling.sh
          bash orion/scripts/install-safe-tooling.sh --plan --category core
      - name: Check isolated script behavior
        run: python orion/scripts/run_skill_sanity.py
      - name: Build and verify the standalone knowledge site
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m orion.scripts.build_singlefile_site
          python tools/verify_singlefile.py orion/ORION-HACKING-singlefile.html --js-output "$RUNNER_TEMP/orion-site.js"
          node --check "$RUNNER_TEMP/orion-site.js"
      - name: Retain verified standalone HTML
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orion-standalone-html
          path: orion/ORION-HACKING-singlefile.html
          if-no-files-found: error
          retention-days: 14

  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: "3.10"}
          - {os: ubuntu-24.04, python: "3.12"}
          - {os: ubuntu-24.04, python: "3.14"}
          - {os: ubuntu-24.04, python: "3.15"}
          - {os: windows-2025, python: "3.12"}
          - {os: windows-2025, python: "3.15"}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and MCP SDK
        run: |
          python -m pip install --upgrade 'pip>=26.2,<27'
          python -m pip install ".[dev,mcp]"
          python -m pip check
          python -m pip freeze > "$RUNNER_TEMP/orion-test-environment.txt"
      - name: Compile on this interpreter
        run: python -m compileall -q orion tools tests .github/scripts
      - name: Test with only loopback sockets allowed
        run: >-
          python -m pytest -v
          --allow-hosts=127.0.0.1,::1 --allow-unix-socket --timeout=90
          --junitxml="$RUNNER_TEMP/orion-tests.xml"
      - name: Validate PowerShell bootstrap without installing tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'orion/scripts/install-safe-tooling.ps1').Path,
            [ref]$tokens,
            [ref]$errorsFound
          ) | Out-Null
          if ($errorsFound.Count -gt 0) { throw ($errorsFound | Out-String) }
          $plan = ./orion/scripts/install-safe-tooling.ps1 -Category core | ConvertFrom-Json
          if ($plan.mode -ne 'plan' -or $plan.contact_network -ne $false) {
            throw 'Default PowerShell installer must be read-only'
          }
      - name: Record actual interpreter and optional-tool health
        run: |
          python -m orion runtime-info --json
          python -m orion plugins doctor
      - name: Retain tests and dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/orion-tests.xml
            ${{ runner.temp }}/orion-test-environment.txt
          if-no-files-found: warn
          retention-days: 14

  core:
    name: Base install without MCP
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - name: Install core and development tools only
        run: |
          python -m pip install --upgrade 'pip>=26.2,<27'
          python -m pip install ".[dev]"
          python -m pip check
          python -c "import importlib.util; assert importlib.util.find_spec('mcp') is None"
      - name: Validate and test without the optional SDK
        run: |
          python tools/validate_repository.py
          python -m pytest --allow-hosts=127.0.0.1,::1 --allow-unix-socket --timeout=90
          python -m orion plugins doctor

  package:
    name: Wheel and source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Prepare build tools and optional SDK
        run: |
          python -m pip install --upgrade 'pip>=26.2,<27'
          python -m pip install ".[dev,mcp]"
      - name: Build the wheel from the source distribution
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build --outdir "$RUNNER_TEMP/orion-dist"
      - name: Install base wheel in a clean virtual environment without dependencies
        run: |
          python -m venv "$RUNNER_TEMP/orion-wheel-base"
          "$RUNNER_TEMP/orion-wheel-base/bin/python" -m pip install --no-index --no-deps "$RUNNER_TEMP"/orion-dist/*.whl
          "$RUNNER_TEMP/orion-wheel-base/bin/python" -m pip check
          "$RUNNER_TEMP/orion-wheel-base/bin/python" -I .github/scripts/smoke_install.py --expect-mcp absent
      - name: Install source distribution and verify outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/orion-dist/*.tar.gz
          python -m pip check
          python -I .github/scripts/smoke_install.py --expect-mcp present
      - name: Resolve the wheel MCP extra and verify installed resources
        run: |
          wheel=("$RUNNER_TEMP"/orion-dist/*.whl)
          python -m pip install --force-reinstall "${wheel[0]}[mcp]"
          python -m pip check
          python -I .github/scripts/smoke_install.py --expect-mcp present
          python -m pip freeze > "$RUNNER_TEMP/orion-dist/resolved-environment.txt"
      - name: Retain verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orion-distributions
          path: ${{ runner.temp }}/orion-dist
          if-no-files-found: error
          retention-days: 14
